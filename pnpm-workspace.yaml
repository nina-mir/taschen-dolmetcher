# pnpm settings for this project.

# Require npm package versions to be at least one day old before installing
# them. Most malicious releases are caught and pulled within hours, so this
# is a cheap defence against supply-chain attacks.
minimumReleaseAge: 1440

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

# sharp (used by `pnpm thumbs`) ships ready-made binaries, so its install
# script isn't needed
ignoredBuiltDependencies:
  - sharp

overrides:
  esbuild: "0.27.3"
